[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # quick-xml 0.38 is pulled in by Typst's bibliography support (citationberg).
  # Both advisories concern attribute iteration and namespace resolution of
  # untrusted XML; proofback never feeds Typst untrusted XML (it compiles the
  # author's own project, with no bibliography files from reviewers), and its own
  # DOCX reader uses quick-xml 0.42.
  { id = "RUSTSEC-2026-0194", reason = "transitive via Typst; not reachable with untrusted input" },
  { id = "RUSTSEC-2026-0195", reason = "transitive via Typst; not reachable with untrusted input" },
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0", "BSL-1.0", "0BSD", "CDLA-Permissive-2.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
