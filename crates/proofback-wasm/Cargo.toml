[package]
name = "proofback-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pdfium-render = { version = "0.9.6", default-features = false, features = ["pdfium_latest"] }
proofback-anchor = { version = "0.0.0", path = "../proofback-anchor" }
proofback-emit = { version = "0.0.0", path = "../proofback-emit" }
proofback-model = { version = "0.0.0", path = "../proofback-model" }
proofback-pdf = { version = "0.0.0", path = "../proofback-pdf" }
proofback-store = { version = "0.0.0", path = "../proofback-store" }
proofback-synctex = { version = "0.0.0", path = "../proofback-synctex" }
serde_json = "1.0.154"
wasm-bindgen = "=0.2.130"
zip = { version = "7.3.0", default-features = false, features = ["deflate-flate2"] }

[lints]
workspace = true
