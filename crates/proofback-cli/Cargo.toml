[package]
name = "proofback-cli"
description = "Map reviewer feedback on a PDF to the exact line of your LaTeX source"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[[bin]]
name = "proofback"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.10", features = ["derive"] }
proofback-ai = { version = "0.1.0", path = "../proofback-ai" }
proofback-anchor = { version = "0.1.0", path = "../proofback-anchor" }
proofback-docx = { version = "0.1.0", path = "../proofback-docx" }
proofback-emit = { version = "0.1.0", path = "../proofback-emit" }
proofback-mcp = { version = "0.1.0", path = "../proofback-mcp" }
proofback-model = { version = "0.1.0", path = "../proofback-model" }
proofback-notes = { version = "0.1.0", path = "../proofback-notes" }
proofback-pdf = { version = "0.1.0", path = "../proofback-pdf" }
proofback-store = { version = "0.1.0", path = "../proofback-store" }
proofback-synctex = { version = "0.1.0", path = "../proofback-synctex" }
proofback-typst = { version = "0.1.0", path = "../proofback-typst", optional = true }
ratatui = "0.29.0"
serde_json = "1.0.154"

[features]
default = ["typst"]
# Typst support through the embedded Typst compiler.
typst = ["dep:proofback-typst"]

[lints]
workspace = true

[target."cfg(unix)".dependencies]
rlimit = "0.12.0"

[dev-dependencies]
proofback-corpus = { path = "../proofback-corpus" }
proofback-pdf = { path = "../proofback-pdf" }
proofback-typst = { path = "../proofback-typst" }
tempfile = "3.27.0"

