name: Release

# Runs when a version tag (v1.2.3) is pushed. See docs/releasing.md.
#
# 1. verify:   the tag matches every version field and has a CHANGELOG section.
# 2. build:    per-platform archives with the pinned PDFium, SHA-256 checksums and
#              signed build provenance.
# 3. publish:  GitHub Release with the changelog section as notes, installers and a
#              Homebrew formula.
# 4. npm, homebrew, vscode: publish to each registry. A step whose secret is not
#              configured is skipped with a notice; the GitHub Release still ships.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - name: Tag, version fields and changelog agree
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            cargo xtask release-check "${GITHUB_REF_NAME#v}"
          else
            # A manual run from a branch only builds; it never publishes.
            v="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
            cargo xtask release-check "$v" || echo "::warning::not releasable as is; building anyway"
            mkdir -p target && [ -f target/release-notes.md ] || echo "Test build" > target/release-notes.md
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: target/release-notes.md

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, pdfium: linux-x64, archive: tar.gz }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, pdfium: linux-arm64, archive: tar.gz }
          - { target: x86_64-apple-darwin, os: macos-latest, pdfium: mac-x64, archive: tar.gz }
          - { target: aarch64-apple-darwin, os: macos-latest, pdfium: mac-arm64, archive: tar.gz }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, pdfium: win-x64, archive: zip }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm, pdfium: win-arm64, archive: zip }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p proofback-cli
      - name: Fetch the pinned PDFium for this platform
        run: cargo xtask pdfium --platform ${{ matrix.pdfium }}
      - name: Package
        shell: bash
        run: |
          name="proofback-${{ matrix.target }}"
          mkdir -p "dist/$name/lib"
          bin="target/${{ matrix.target }}/release/proofback"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          cp "$bin" "dist/$name/"
          cp target/pdfium/lib/* "dist/$name/lib/" 2>/dev/null || true
          cp target/pdfium/bin/*.dll "dist/$name/" 2>/dev/null || true
          cp target/pdfium/LICENSE "dist/$name/PDFIUM-LICENSE"
          cp -r target/pdfium/licenses "dist/$name/pdfium-licenses"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$name.zip" "$name" > /dev/null
            file="$name.zip"
          else
            tar czf "$name.tar.gz" "$name"
            file="$name.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then sha256sum "$file" > "$file.sha256"; else shasum -a 256 "$file" > "$file.sha256"; fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/proofback-${{ matrix.target }}.*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proofback-${{ matrix.target }}
          path: dist/proofback-${{ matrix.target }}.*

  vsix:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/vscode/package-lock.json
      - name: Test and package the VS Code extension
        working-directory: integrations/vscode
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run package
          mv proofback-*.vsix "proofback-vscode-${GITHUB_REF_NAME#v}.vsix"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: integrations/vscode/*.vsix

  publish:
    needs: [build, vsix]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Generate Homebrew formula
        run: python3 packaging/homebrew/generate.py "${GITHUB_REF_NAME#v}" dist > dist/proofback.rb
      - name: Keep the release notes out of the upload
        run: mkdir -p notes && mv dist/release-notes.md notes/
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/*
            packaging/install.sh
            packaging/install.ps1
          body_path: notes/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homebrew-formula
          path: dist/proofback.rb

  npm:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Skip without NPM_TOKEN
        if: env.NODE_AUTH_TOKEN == ''
        run: echo "::notice::NPM_TOKEN is not set; the npm package was not published. See docs/releasing.md."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.NODE_AUTH_TOKEN != ''
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        if: env.NODE_AUTH_TOKEN != ''
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        if: env.NODE_AUTH_TOKEN != ''
        with:
          tool: wasm-bindgen@0.2.130
      - name: Install wasm-opt (binaryen 133, checksum pinned)
        if: env.NODE_AUTH_TOKEN != ''
        run: |
          curl -sSfL -o "$RUNNER_TEMP/binaryen.tgz" https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          echo "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  $RUNNER_TEMP/binaryen.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/binaryen.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_133/bin" >> "$GITHUB_PATH"
      - name: Build the engine and check it against the native result
        if: env.NODE_AUTH_TOKEN != ''
        run: |
          cargo xtask pdfium
          cargo xtask sample
          cargo xtask npm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.NODE_AUTH_TOKEN != ''
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Test and publish
        if: env.NODE_AUTH_TOKEN != ''
        working-directory: npm
        run: |
          npm test
          tag=latest; case "$GITHUB_REF_NAME" in *-*) tag=next ;; esac
          npm publish --provenance --access public --tag "$tag"

  homebrew:
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'Amet13/homebrew-tap' }}
    steps:
      - name: Skip without HOMEBREW_TAP_TOKEN
        if: env.TAP_TOKEN == ''
        run: echo "::notice::HOMEBREW_TAP_TOKEN is not set; the Homebrew tap was not updated. The formula is attached to the release."
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.TAP_TOKEN != ''
        with:
          name: homebrew-formula
      - name: Push the formula to the tap
        if: env.TAP_TOKEN != ''
        run: |
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Formula
          cp proofback.rb tap/Formula/proofback.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/proofback.rb
          if git diff --cached --quiet; then echo "formula unchanged"; exit 0; fi
          git commit -m "proofback ${GITHUB_REF_NAME#v}"
          git push origin HEAD

  vscode:
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - name: Skip without VSCE_PAT
        if: env.VSCE_PAT == ''
        run: echo "::notice::VSCE_PAT is not set; the extension was not published to the Marketplace. The .vsix is attached to the release."
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.VSCE_PAT != ''
        with:
          name: vsix
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.VSCE_PAT != ''
        with:
          node-version: 22
      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce@4.1.0 publish --packagePath proofback-vscode-*.vsix
