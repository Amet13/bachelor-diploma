name: Release

# Fully automatic; see docs/releasing.md. Nobody tags or builds by hand.
#
# - Push to the default branch: if the version in Cargo.toml has no release yet, build and
#   publish it (a merged version bump releases itself). Otherwise nothing runs.
# - Run workflow (Actions, Release) with "bump" set to patch, minor, major or an
#   exact version: the workflow sets the version everywhere, dates the changelog,
#   commits that to the default branch and releases it in the same run. With "bump" empty it
#   builds everything as a dry run and publishes nothing.
#
# Jobs: prepare (version, checks, optional bump commit), build (archives with the
# pinned PDFium, checksums, signed provenance, Linux for glibc 2.17), vsix, node,
# publish (GitHub Release and tag, notes from CHANGELOG.md), homebrew (optional).
# Nothing goes to npm or the VS Code Marketplace: both files ship in the release.

on:
  push:
    # Publishing is further limited to the repository's default branch, which
    # the prepare job reads at run time.
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Release a new version: patch, minor, major or an exact version such as 1.2.3. Leave empty for a dry run that publishes nothing."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      version: ${{ steps.decide.outputs.version }}
      sha: ${{ steps.decide.outputs.sha }}
      release: ${{ steps.decide.outputs.release }}
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - name: Bump the version and commit it to the default branch
        if: github.event_name == 'workflow_dispatch' && inputs.bump != ''
        env:
          BUMP: ${{ inputs.bump }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Releases are made from $DEFAULT_BRANCH; run the workflow on $DEFAULT_BRANCH."
            exit 1
          fi
          cargo xtask bump "$BUMP"
          v="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $v"
          git push origin "HEAD:$DEFAULT_BRANCH"
      - name: Decide what to do
        id: decide
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          v="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            # Only the default branch publishes. A manual run elsewhere is a dry
            # run; a push to another branch does nothing.
            echo "release=false" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
              echo "build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cargo xtask release-check "$v" || echo "::warning::v$v is not releasable as is"
            echo "build=true" >> "$GITHUB_OUTPUT"
            mkdir -p target && [ -f target/release-notes.md ] || echo "Dry run" > target/release-notes.md
            echo "::notice::Dry run on $GITHUB_REF_NAME: builds everything, publishes nothing."
          elif git rev-parse -q --verify "refs/tags/v$v" > /dev/null; then
            echo "v$v is already released."
            echo "release=false" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "build=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Dry run: v$v exists, so this run builds everything and publishes nothing."
            else
              echo "build=false" >> "$GITHUB_OUTPUT"
            fi
            mkdir -p target && echo "Dry run" > target/release-notes.md
          else
            # An unreleased version on the default branch must be releasable; fail loudly if
            # the changelog or a version field disagrees.
            cargo xtask release-check "$v"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Releasing v$v"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.decide.outputs.build == 'true'
        with:
          name: release-notes
          path: target/release-notes.md

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux links against glibc 2.17 (cargo-zigbuild), so the binary runs on
          # every maintained distribution, not only on the runner's own.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, pdfium: linux-x64, archive: tar.gz, glibc: "2.17", run: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, pdfium: linux-arm64, archive: tar.gz, glibc: "2.17", run: true }
          # Intel macOS is cross-built on an Apple Silicon runner and cannot run there.
          - { target: x86_64-apple-darwin, os: macos-latest, pdfium: mac-x64, archive: tar.gz, run: false }
          - { target: aarch64-apple-darwin, os: macos-latest, pdfium: mac-arm64, archive: tar.gz, run: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, pdfium: win-x64, archive: zip, run: true }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm, pdfium: win-arm64, archive: zip, run: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install zig and cargo-zigbuild (Linux)
        if: matrix.glibc
        run: python3 -m pip install --user --break-system-packages ziglang==0.15.2 || python3 -m pip install --user ziglang==0.15.2
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        if: matrix.glibc
        with:
          tool: cargo-zigbuild@0.24.1
      - name: Build
        shell: bash
        run: |
          if [ -n "${{ matrix.glibc }}" ]; then
            cargo zigbuild --release --locked --target "${{ matrix.target }}.${{ matrix.glibc }}" -p proofback-cli
          else
            cargo build --release --locked --target ${{ matrix.target }} -p proofback-cli
          fi
      - name: The Linux binary needs no glibc newer than ${{ matrix.glibc }}
        if: matrix.glibc
        run: |
          newest="$(objdump -T target/${{ matrix.target }}/release/proofback | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)"
          echo "newest glibc symbol: $newest"
          [ "$(printf '%s\n%s\n' "$newest" "${{ matrix.glibc }}" | sort -V | tail -1)" = "${{ matrix.glibc }}" ]
      - name: Fetch the pinned PDFium for this platform
        run: cargo xtask pdfium --platform ${{ matrix.pdfium }}
      - name: Package
        shell: bash
        run: |
          name="proofback-${{ matrix.target }}"
          mkdir -p "dist/$name/lib"
          bin="target/${{ matrix.target }}/release/proofback"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          cp "$bin" "dist/$name/"
          cp target/pdfium/lib/* "dist/$name/lib/" 2>/dev/null || true
          cp target/pdfium/bin/*.dll "dist/$name/" 2>/dev/null || true
          cp target/pdfium/LICENSE "dist/$name/PDFIUM-LICENSE"
          cp -r target/pdfium/licenses "dist/$name/pdfium-licenses"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          if [ "${{ matrix.run }}" = "true" ]; then
            "dist/$name/proofback" --version
          fi
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$name.zip" "$name" > /dev/null
            file="$name.zip"
          else
            tar czf "$name.tar.gz" "$name"
            file="$name.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then sha256sum "$file" > "$file.sha256"; else shasum -a 256 "$file" > "$file.sha256"; fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/proofback-${{ matrix.target }}.*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proofback-${{ matrix.target }}
          path: dist/proofback-${{ matrix.target }}.*

  vsix:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/vscode/package-lock.json
      - name: Test and package the VS Code extension
        working-directory: integrations/vscode
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run package
          mv proofback-*.vsix proofback-vscode.vsix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: integrations/vscode/*.vsix

  node:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: wasm-bindgen@0.2.130
      - name: Install wasm-opt (binaryen 133, checksum pinned)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/binaryen.tgz" https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          echo "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  $RUNNER_TEMP/binaryen.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/binaryen.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_133/bin" >> "$GITHUB_PATH"
      - name: Build the engine and the native reference result
        run: |
          cargo xtask pdfium
          cargo xtask sample
          cargo xtask npm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check against the native result and pack
        working-directory: npm
        run: |
          npm test
          npm pack
          mv proofback-*.tgz proofback-node.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node
          path: npm/proofback-node.tgz

  publish:
    needs: [prepare, build, vsix, node]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Generate Homebrew formula
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 packaging/homebrew/generate.py "$VERSION" dist > dist/proofback.rb
      - name: Keep the release notes out of the upload
        run: mkdir -p notes && mv dist/release-notes.md notes/
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/*
            packaging/install.sh
            packaging/install.ps1
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: v${{ needs.prepare.outputs.version }}
          body_path: notes/release-notes.md
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homebrew-formula
          path: dist/proofback.rb

  homebrew:
    needs: [prepare, publish]
    if: ${{ !contains(needs.prepare.outputs.version, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'Amet13/homebrew-tap' }}
    steps:
      - name: Skip without HOMEBREW_TAP_TOKEN
        if: env.TAP_TOKEN == ''
        run: echo "::notice::HOMEBREW_TAP_TOKEN is not set; the Homebrew tap was not updated. The formula is attached to the release."
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.TAP_TOKEN != ''
        with:
          name: homebrew-formula
      - name: Push the formula to the tap
        if: env.TAP_TOKEN != ''
        run: |
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Formula
          cp proofback.rb tap/Formula/proofback.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/proofback.rb
          if git diff --cached --quiet; then echo "formula unchanged"; exit 0; fi
          git commit -m "proofback ${{ needs.prepare.outputs.version }}"
          git push origin HEAD
